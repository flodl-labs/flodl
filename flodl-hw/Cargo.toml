[package]
name = "flodl-hw"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Hardware detection for flodl: GPUs and host RAM, with no libtorch and no CUDA runtime"
readme = "README.md"
keywords = ["gpu", "detection", "nvidia", "hardware", "flodl"]
categories = ["hardware-support", "science"]

# No libtorch, no CUDA toolkit, no build script: this crate must build
# and run on a host that has none of that. Every probe is a std-only
# filesystem read, a bounded subprocess, or (host RAM on macOS and
# Windows) a call into the OS's own C library, which std links anyway.
#
# serde_json is the single dependency, and it is free in practice: it is
# already a direct dependency of `flodl`, `flodl-cli` and `flodl-hf`, so
# a workspace build and a `cargo install flodl-cli` both compile exactly
# zero extra crates for it. It is also the dependency family flodl-cli's
# otherwise-zero-external-crate policy already carves out. Used only to
# read FLODL_TESTING_GPU_JSON (see src/testing.rs); hand-rolling a JSON
# reader here would mean owning ~275 lines of parser forever to avoid a
# crate every consumer already builds.
[dependencies]
serde_json.workspace = true
