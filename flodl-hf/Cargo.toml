[package]
name = "flodl-hf"
version.workspace = true
edition.workspace = true
# Not the workspace floor: the Hub client's dependency chain sets a higher
# one, and the core crates must not inherit it (see the workspace
# Cargo.toml). Checked by `ci.yml`'s msrv job on exactly this toolchain.
#   1.91  `xet-core-structures`, reached through hf-hub 1.0's MANDATORY
#         `hf-xet` dependency. It calls `str::floor_char_boundary`, stable
#         only from 1.91, and declares no `rust-version`, so nothing warns:
#         it simply fails to compile on a lower floor.
#   1.95  `sysinfo` 0.39 through the same chain: `xet-runtime` 1.7
#         requires `sysinfo ^0.39` and declares no floor of its own, so
#         MSRV-aware resolution cannot step back to 1.6 and its 0.38.
#         `sysinfo` 0.39.6 declares 1.95. Raised 2026-10-10.
rust-version = "1.95"
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "HuggingFace integration for flodl: safetensors, hub, tokenizers, pre-built models"
readme = "README.md"
keywords = ["huggingface", "transformers", "safetensors", "deep-learning", "flodl"]
categories = ["science", "artificial-intelligence"]
include = [
    "src/**/*",
    "examples/*.rs",
    "tests/*.rs",
    "tests/common/**/*",
    "README.md",
    "LICENSE",
    "Cargo.toml",
]
# tests/fixtures/ excluded: ~15 MB of safetensors parity fixtures used by
# `_live` tests against the PyTorch reference. Tests run from source
# checkouts, not from the published crate, so the fixtures don't need to
# ship and would push the package past crates.io's 10 MB upload limit.

[features]
default = ["hub", "tokenizer"]
gpu = ["flodl/gpu"]
cuda = ["gpu", "flodl/cuda"]
rocm = ["gpu", "flodl/rocm"]
hub = ["hf-hub", "dep:flodl-cli"]
tokenizer = ["tokenizers"]

[dependencies]
flodl.workspace = true
safetensors.workspace = true
serde_json.workspace = true
hf-hub = { workspace = true, optional = true }
tokenizers = { workspace = true, optional = true }
# Optional, gated behind `hub`: lets the export_hf CLI binary use the
# FdlArgs derive so its --help output matches what `fdl flodl-hf export
# -h` renders. Pure-Rust dep; pulls no libtorch.
flodl-cli = { workspace = true, optional = true }

