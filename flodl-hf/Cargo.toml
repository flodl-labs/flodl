required-features = ["hub", "tokenizer"]

[[example]]
name = "roberta_classify"
required-features = ["hub", "tokenizer"]

[[example]]
name = "roberta_ner"
required-features = ["hub", "tokenizer"]

[[example]]
name = "roberta_qa"
required-features = ["hub", "tokenizer"]

[[example]]
name = "distilbert_embed"
required-features = ["hub", "tokenizer"]

[[example]]
name = "distilbert_classify"
required-features = ["hub", "tokenizer"]

[[example]]
name = "distilbert_ner"
required-features = ["hub", "tokenizer"]

[[example]]
name = "distilbert_qa"
required-features = ["hub", "tokenizer"]

[[example]]
name = "distilbert_finetune"
