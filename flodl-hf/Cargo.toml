[[example]]
name = "distilbert_finetune_ddp"
required-features = ["hub", "tokenizer"]

[[example]]
name = "auto_classify"
required-features = ["hub", "tokenizer"]

[[example]]
name = "export_hf"
required-features = ["hub"]

[package.metadata.docs.rs]
all-features = true
# `--cfg docsrs` as rustdoc-arg ONLY. Passing it via rustc-args
# propagates to every dep compile including serde, tripping
# serde 1.0.228's broken `cfg(all(docsrs, if_docsrs_then_no_serde_core))`
# path. Real docs.rs only applies the cfg at doc time.
rustdoc-args = ["--cfg", "docsrs"]
