services:
  # RHEL-family reproduction box. Not part of any routine flow: it
  # exists so a RHEL question can be answered on a RHEL userland instead
  # of by reasoning about one — the dnf package names, rrsync shipping
  # as documentation, and which libtorch baselines EL9 can actually
  # load. Deliberately NOT what CI uses: the rocky legs run a stock
  # image and install prerequisites the way the docs tell a user to,
  # which is the step a pre-baked image would skip.
  #
  #   docker compose build rhel
  #   docker compose run --rm rhel bash
  rhel:
    build:
      context: .
      dockerfile: Dockerfile.rhel
    image: flodl-rhel
    volumes:
      - .:/workspace
      # Its own cargo cache, for ownership rather than content: the
      # registry cache holds crate sources, which are the same on every
      # platform (built trees live in target/), and every other service
      # shares ./.cargo-cache. This one runs as root with cargo's home
      # under /root, and root-owned entries in the shared cache would
      # break the uid-1000 services that write beside them.
      - ./.cargo-cache-rhel:/root/.cargo/registry
      - ${LIBTORCH_CPU_PATH:-./libtorch/precompiled/cpu}:/usr/local/libtorch:ro
    working_dir: /workspace
    stdin_open: true
    tty: true
    environment:
      - FLODL_VERBOSITY
      - FDL_GPU_FEATURE

  dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: flodl-dev
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - .:/workspace
      # One registry + git cache for every service that runs as the host
      # user: the cache holds crate sources and the index, identical for
      # every image and toolchain (compiled output is per-service, in
      # target/), and cargo's file locks work across bind mounts of the
      # same directory, so concurrent containers serialize correctly.
      - ./.cargo-cache:/usr/local/cargo/registry
      - ./.cargo-git:/usr/local/cargo/git
      - ./.cargo-credentials.toml:/usr/local/cargo/credentials.toml
      - ${LIBTORCH_CPU_PATH:-./libtorch/precompiled/cpu}:/usr/local/libtorch:ro
    working_dir: /workspace
    stdin_open: true
    tty: true
    # Container hostname inherits the host's hostname so the cluster
    # launcher matches `cluster.workers[].host == hostname()` (otherwise
    # the container ID is used and the host reads as unknown).
    # `fdl` exports HOSTNAME itself; the `:-` default only keeps a bare
    # `docker compose` (make, ci, IDE) from warning about it being unset.
    hostname: ${HOSTNAME:-}
    environment:
      - FLODL_VERBOSITY
      - FLODL_NET_TIMEOUT_SCALE
      # The cargo feature the active libtorch variant needs, computed by
      # fdl from the variant path. Lets a `run:` line say
      # `--features "$FDL_GPU_FEATURE"` instead of hardcoding a vendor.
      - FDL_GPU_FEATURE
      # Cluster envelope: when fdl-cli activates a `cluster: true`
      # command, these are set on the controller process so the
      # spawned user binary's `flodl::launcher::dispatch` detects
      # launcher role and fans out. Bare names = pass-through from
      # the docker compose caller's env (the fdl-cli process).
      - FLODL_INTERNAL_FULL_CLUSTER_JSON
      - FLODL_INTERNAL_FDL_CMD
      - FDL_ENV
      - FLODL_INTERNAL_PREBUILD_PER_HOST
      # Controller's user name (host-side). Read by the launcher inside
      # the container as the default `ssh -l <user>` target when the
      # per-host `ssh.user:` is unset, bridges container's stock
      # `ubuntu` (UID 1000) identity vs. the user's actual remote
      # account.
      - FLODL_INTERNAL_HOST_USER
      # Share the hf-hub cache with the hf-parity service so `fdl test-live`
      # reuses fixtures downloaded by `fdl flodl-hf parity bert*`. Repo-local,
      # gitignored, survives container rebuild.
      - HF_HOME=/workspace/.hf-cache
      # Throttle cargo's link parallelism. Required on macOS Docker (OrbStack)
      # where the virtiofs-mounted libtorch directory cannot serve many
      # concurrent `ld` lookups — the linker reports `cannot find -ltorch`
      # spuriously. Unset on Linux native (CARGO_BUILD_JOBS empty → default).
      - CARGO_BUILD_JOBS

  cuda:
    build:
      context: .
      dockerfile: Dockerfile.cuda
      args:
        CUDA_VERSION: ${CUDA_VERSION:-12.8.0}
    image: flodl-cuda:${CUDA_TAG:-12.8}
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - .:/workspace
      - ./.cargo-cache:/usr/local/cargo/registry
      - ./.cargo-git:/usr/local/cargo/git
      - ./.cargo-credentials.toml:/usr/local/cargo/credentials.toml
      - ${LIBTORCH_HOST_PATH:-./libtorch/precompiled/cu128}:/usr/local/libtorch:ro
      # SSH-agent socket forwarded so the launcher can ssh into remote
      # cluster hosts. Falls back to /dev/null when the user has no
      # agent running — ssh then errors loudly inside the container,
      # which is the right signal for non-cluster runs.
      - ${SSH_AUTH_SOCK:-/dev/null}:/ssh-agent
    working_dir: /workspace
    stdin_open: true
    tty: true
    # NCCL falls back to SHM transport when GPUs lack peer-to-peer (no NVLink,
    # separate PCIe slots — the consumer-rig case). 3-GPU heterogeneous DDP on
    # any non-trivial model exhausts Docker's default 64 MB /dev/shm. 2 GB is
    # generous headroom for ResNet-class workspaces.
    shm_size: 2gb
    # Container hostname inherits the host's hostname so the cluster
    # launcher matches `cluster.workers[].host == hostname()` (otherwise
    # the container ID is used and the host reads as unknown).
    # `fdl` exports HOSTNAME itself; the `:-` default only keeps a bare
    # `docker compose` (make, ci, IDE) from warning about it being unset.
    hostname: ${HOSTNAME:-}
    # Share the host's network namespace so the cluster controller +
    # coord (bound on exa-side ports) are reachable from remote rank
    # VMs. Docker's default bridge isolates the container from the
    # host's other networks (virbr0, enp1s0, etc.); with
    # `network_mode: host` the container sees every interface the
    # host has, and `master_addr` resolves identically inside and
    # outside the container.
    network_mode: host
    environment:
      - FLODL_VERBOSITY
      - FLODL_NET_TIMEOUT_SCALE
      # The cargo feature the active libtorch variant needs, computed by
      # fdl from the variant path. Lets a `run:` line say
      # `--features "$FDL_GPU_FEATURE"` instead of hardcoding a vendor.
      - FDL_GPU_FEATURE
      # Cluster envelope: when fdl-cli activates a `cluster: true`
      # command, these are set on the controller process so the
      # spawned user binary's `flodl::launcher::dispatch` detects
      # launcher role and fans out. Bare names = pass-through from
      # the docker compose caller's env (the fdl-cli process).
      - FLODL_INTERNAL_FULL_CLUSTER_JSON
      - FLODL_INTERNAL_FDL_CMD
      - FDL_ENV
      - FLODL_INTERNAL_PREBUILD_PER_HOST
      # Controller's user name (host-side). Read by the launcher inside
      # the container as the default `ssh -l <user>` target when the
      # per-host `ssh.user:` is unset, bridges container's stock
      # `ubuntu` (UID 1000) identity vs. the user's actual remote
      # account.
      - FLODL_INTERNAL_HOST_USER
      # SSH-agent forwarding: launcher SSHes into remote cluster hosts
      # from inside this container. The host's agent socket is bind-
      # mounted at /ssh-agent (see volumes:) and re-exposed via
      # SSH_AUTH_SOCK so ssh-add'ed keys work without copying private
      # material into the image. Run `eval $(ssh-agent) && ssh-add` on
      # the host before `fdl @cluster ...`.
      - SSH_AUTH_SOCK=/ssh-agent
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # cuda-rank: long-lived sshd container for cluster-mode dispatch.
  #
  # Treats this container as a VM-equivalent "remote host" so the
  # cluster launcher reaches it over SSH (fresh process tree, no
  # fork+exec inheritance from the launcher process). Mirrors the
  # `flodl-pascal` VM transport shape but over loopback.
  #
  # Usage:
  #   # 1. Generate a dedicated keypair on the host (one-time):
  #   mkdir -p .ssh-cuda-rank && \
  #     ssh-keygen -t ed25519 -N '' \
  #       -f .ssh-cuda-rank/cuda_rank_key \
  #       -C 'flodl cuda-rank container'
  #   cp .ssh-cuda-rank/cuda_rank_key.pub .ssh-cuda-rank/authorized_keys
  #
  #   # 2. Bring the container up (auto-builds Dockerfile.cuda on first run):
  #   docker compose up -d cuda-rank
  #
  #   # 3. Verify SSH from host:
  #   ssh -p 2222 -i .ssh-cuda-rank/cuda_rank_key \
  #       -o StrictHostKeyChecking=accept-new ubuntu@127.0.0.1 whoami
  #
  #   # 4. In fdl.cluster.yml, replace the exa host entry with:
  #   #   - host: exa-cuda
  #   #     ranks: [0]
  #   #     local_devices: [0]
  #   #     nccl_socket_ifname: virbr0
  #   #     path: /workspace                # in-container project path
  #   #     ssh:
  #   #       target: 127.0.0.1
  #   #       port: 2222
  #   #       user: ubuntu
  #   #       identity_file: /home/me/project/.ssh-cuda-rank/cuda_rank_key
  #   #     arch: precompiled/cu128
  #   # (drop `docker: cuda` -- launcher dispatches via SSH, not via docker)
  # ROCm counterpart of `cuda`. Same shape: no libtorch baked in, the
  # matching variant bind-mounted from libtorch/.
  #
  # `fdl` resolves `docker: gpu` to this service when the active libtorch
  # variant is an AMD build, so fdl.yml never names a vendor.
  #
  # Device passthrough differs from NVIDIA in kind, not degree: there is
  # no runtime shim, the kernel interfaces are handed in directly.
  # /dev/kfd is the compute device, /dev/dri the render nodes, and the
  # video/render groups gate access to both.
  rocm:
    build:
      context: .
      dockerfile: Dockerfile.rocm
      args:
        ROCM_VERSION: ${ROCM_VERSION:-7.0}
    image: flodl-rocm:${ROCM_TAG:-7.0}
    user: "${UID:-1000}:${GID:-1000}"
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
      - render
    # HSA needs these to map queues; without them the runtime fails at
    # device init rather than at first op.
    security_opt:
      - seccomp:unconfined
    ipc: host
    volumes:
      - .:/workspace
      - ./.cargo-cache:/usr/local/cargo/registry
      - ./.cargo-git:/usr/local/cargo/git
      - ./.cargo-credentials.toml:/usr/local/cargo/credentials.toml
      # LIBTORCH_HOST_PATH, same as the cuda services: fdl exports it
      # from the ACTIVE variant, so a `builds/gfx…` install (or a
      # per-host `arch:` in prebuild docker mode) mounts what fdl
      # resolved instead of a hardcoded default it silently ignores.
      - ${LIBTORCH_HOST_PATH:-./libtorch/precompiled/rocm70}:/usr/local/libtorch:ro
      - ${SSH_AUTH_SOCK:-/dev/null}:/ssh-agent
    working_dir: /workspace
    stdin_open: true
    tty: true
    shm_size: 2gb
    # Container hostname inherits the host's hostname so the cluster
    # launcher matches `cluster.workers[].host == hostname()` (otherwise
    # the container ID is used and the host reads as unknown).
    # `fdl` exports HOSTNAME itself; the `:-` default only keeps a bare
    # `docker compose` (make, ci, IDE) from warning about it being unset.
    hostname: ${HOSTNAME:-}
    network_mode: host
    environment:
      - FLODL_VERBOSITY
      - FLODL_NET_TIMEOUT_SCALE
      # The cargo feature the active libtorch variant needs, computed by
      # fdl from the variant path. Lets a `run:` line say
      # `--features "$FDL_GPU_FEATURE"` instead of hardcoding a vendor.
      - FDL_GPU_FEATURE
      - FLODL_INTERNAL_FULL_CLUSTER_JSON
      - FLODL_INTERNAL_FDL_CMD
      - FDL_ENV
      - FLODL_INTERNAL_PREBUILD_PER_HOST
      # Same two the cuda service carries, for the same reasons: the
      # launcher inside this container SSHes to remote hosts (fan-out),
      # so it needs the host-side user name and the agent socket the
      # volumes block already mounts — without these a ROCm controller
      # fails every remote dial with a bare `Permission denied`.
      - FLODL_INTERNAL_HOST_USER
      - SSH_AUTH_SOCK=/ssh-agent

  cuda-rank:
    image: flodl-cuda:${CUDA_TAG:-12.8}
    build:
      context: .
      dockerfile: Dockerfile.cuda
      args:
        CUDA_VERSION: ${CUDA_VERSION:-12.8.0}
    # sshd needs root to bind a privileged port (none here — 2222) and
    # to privilege-drop on login (PAM). NOT setting `user:` lets the
    # default root identity hold for the sshd process; the SSH'd login
    # lands as `ubuntu` per the Dockerfile.cuda config.
    volumes:
      - .:/workspace
      - ./.cargo-cache:/usr/local/cargo/registry
      - ./.cargo-git:/usr/local/cargo/git
      - ./.cargo-credentials.toml:/usr/local/cargo/credentials.toml
      - ${LIBTORCH_HOST_PATH:-./libtorch/precompiled/cu128}:/usr/local/libtorch:ro
      # Public key file → authorized_keys (read-only). Generate on host
      # via the `ssh-keygen` step in the usage comment above.
      - ${CUDA_RANK_AUTHORIZED_KEYS:-./.ssh-cuda-rank/authorized_keys}:/home/ubuntu/.ssh/authorized_keys:ro
      # Persistent host keys so SSH client's known_hosts doesn't churn
      # on every container restart.
      - ./.ssh-cuda-rank/host_keys:/etc/ssh/host_keys
    working_dir: /workspace
    # Generate host keys on first start, fix authorized_keys perms, run
    # sshd in the foreground so the container lives. `-e` sends sshd
    # logs to stderr (visible via `docker compose logs cuda-rank`).
    command:
      - bash
      - -c
      - |
        set -e
        for k in rsa ecdsa ed25519; do
          f=/etc/ssh/host_keys/ssh_host_$${k}_key
          [ -f "$$f" ] || ssh-keygen -q -N '' -t $$k -f "$$f"
          ln -sf "$$f" /etc/ssh/ssh_host_$${k}_key
        done
        chown ubuntu:ubuntu /home/ubuntu/.ssh/authorized_keys 2>/dev/null || true
        chmod 600 /home/ubuntu/.ssh/authorized_keys 2>/dev/null || true
        # Symlink fdl into PATH for SSH'd sessions. The launcher's
        # SSH remote command does `exec fdl <subcmd>` (per
        # launcher.rs:905); sshd's non-interactive session PATH
        # doesn't include /workspace/target/release. Symlink survives
        # rebuilds of fdl because it's recreated every container start.
        ln -sf /workspace/target/release/fdl /usr/local/bin/fdl
        # Ensure the SSH'd session inherits libtorch on LD_LIBRARY_PATH
        # (sshd's PAM env doesn't auto-propagate it). The remote command
        # in launcher.rs already sets LD_LIBRARY_PATH explicitly via the
        # prebuild envelope, but bake a default for non-prebuild paths
        # and interactive debugging.
        # /etc/environment is read by PAM on SSH login. Bake the
        # Dockerfile's ENV bits so SSH'd non-interactive commands
        # inherit them (Dockerfile ENV is NOT inherited by SSH sessions).
        cat > /etc/environment <<EOF
        LD_LIBRARY_PATH=$${LIBTORCH_PATH}/lib:/usr/local/cuda/lib64
        LIBRARY_PATH=$${LIBTORCH_PATH}/lib:/usr/local/cuda/lib64
        LIBTORCH_PATH=$${LIBTORCH_PATH}
        CUDA_HOME=/usr/local/cuda
        RUSTUP_HOME=$${RUSTUP_HOME}
        CARGO_HOME=$${CARGO_HOME}
        PATH=$${PATH}
        EOF
        exec /usr/sbin/sshd -D -e
    # `cuda-rank` is a remote host from the launcher's POV, so its
    # hostname is distinct from the host's. The cluster.yml `name:`
    # field must match this (rather than $HOSTNAME) for the launcher
    # to take the SSH path.
    hostname: exa-cuda
    # Share host network: sshd binds on the host's 127.0.0.1:2222.
    # NCCL transport interfaces (virbr0 etc.) are also reachable
    # because they're host-side interfaces.
    network_mode: host
    shm_size: 2gb
    # No env passthrough needed — the launcher SSHes in fresh and sets
    # the slim envelope (FLODL_INTERNAL_CLUSTER_JSON, FLODL_INTERNAL_LOCAL_RANK) on the
    # SSH command line, exactly like the Pascal VM path.
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  bench:
    build:
      context: .
      dockerfile: Dockerfile.bench
    image: flodl-bench
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - .:/workspace
      - ./.cargo-cache:/usr/local/cargo/registry
      - ./.cargo-git:/usr/local/cargo/git
      - ${LIBTORCH_HOST_PATH:-./libtorch/precompiled/cu128}:/usr/local/libtorch:ro
    working_dir: /workspace
    stdin_open: true
    tty: true
    # See `cuda` service: NCCL SHM transport on multi-GPU heterogeneous setups
    # exhausts the 64 MB Docker default /dev/shm.
    shm_size: 2gb
    # Container hostname inherits the host's hostname so the cluster
    # launcher matches `cluster.workers[].host == hostname()` (otherwise
    # the container ID is used and the host reads as unknown).
    # `fdl` exports HOSTNAME itself; the `:-` default only keeps a bare
    # `docker compose` (make, ci, IDE) from warning about it being unset.
    hostname: ${HOSTNAME:-}
    # Share the host's network namespace so the cluster controller +
    # coord (bound on exa-side ports) are reachable from remote rank
    # VMs. Docker's default bridge isolates the container from the
    # host's other networks (virbr0, enp1s0, etc.); with
    # `network_mode: host` the container sees every interface the
    # host has, and `master_addr` resolves identically inside and
    # outside the container.
    network_mode: host
    environment:
      - FLODL_VERBOSITY
      - FLODL_NET_TIMEOUT_SCALE
      # The cargo feature the active libtorch variant needs, computed by
      # fdl from the variant path. Lets a `run:` line say
      # `--features "$FDL_GPU_FEATURE"` instead of hardcoding a vendor.
      - FDL_GPU_FEATURE
      # Cluster envelope: when fdl-cli activates a `cluster: true`
      # command, these are set on the controller process so the
      # spawned user binary's `flodl::launcher::dispatch` detects
      # launcher role and fans out. Bare names = pass-through from
      # the docker compose caller's env (the fdl-cli process).
      - FLODL_INTERNAL_FULL_CLUSTER_JSON
      - FLODL_INTERNAL_FDL_CMD
      - FDL_ENV
      - FLODL_INTERNAL_PREBUILD_PER_HOST
      # Controller's user name (host-side). Read by the launcher inside
      # the container as the default `ssh -l <user>` target when the
      # per-host `ssh.user:` is unset, bridges container's stock
      # `ubuntu` (UID 1000) identity vs. the user's actual remote
      # account.
      - FLODL_INTERNAL_HOST_USER
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  docs-rs:
    image: rust:latest
    # Same host-identity mapping as every other build service. Without
    # it this one ran as root and left root-owned artifacts in the three
    # bind-mounted dirs below, which the owning user then cannot delete
    # (`fdl cargo target --clear` skips them) and `actions/cache` cannot
    # read. Stock `rust:latest` makes `/usr/local/{cargo,rustup}`
    # world-writable, so `rustup install nightly` still works here.
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - .:/workspace
      - ./.cargo-cache:/usr/local/cargo/registry
      - ./.cargo-git:/usr/local/cargo/git
      - ./.target-docsrs:/opt/target
    working_dir: /workspace/flodl
    environment:
      - CARGO_TARGET_DIR=/opt/target
      - DOCS_RS=1

  hf-parity:
    build:
      context: flodl-hf/scripts
      dockerfile: Dockerfile.parity
    image: flodl-hf-parity
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - .:/workspace
    working_dir: /workspace/flodl-hf
    environment:
      - HF_HOME=/workspace/.hf-cache

  jekyll:
    image: jekyll/jekyll:4
    volumes:
      - ./site:/srv/jekyll
      - jekyll-bundle:/usr/local/bundle
    ports:
      - "4000:4000"
    # --host 0.0.0.0: jekyll defaults to binding 127.0.0.1 INSIDE the
    # container, which resets every connection docker-proxy forwards from
    # the host (port mapped, page never loads).
    command: bash -c "bundle install && jekyll serve --host 0.0.0.0 --watch --force_polling --livereload"
    environment:
      - JEKYLL_ENV=development

volumes:
  jekyll-bundle:
