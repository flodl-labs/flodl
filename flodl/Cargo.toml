[package]
name = "flodl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "floDl — a flow-graph deep learning framework built on libtorch"
readme = "../README.md"
keywords = ["deep-learning", "machine-learning", "neural-network", "libtorch", "graph"]
categories = ["science", "artificial-intelligence"]
include = [
    "src/**/*",
    "examples/**/*.rs",
    "examples/**/*.md",
    "Cargo.toml",
]

[features]
default = ["rng"]
# Vendor selectors. `cuda` keeps working exactly as before; `gpu` is the
# vendor-neutral gate they both imply (see flodl-sys/Cargo.toml).
gpu = ["flodl-sys/gpu"]
cuda = ["gpu", "flodl-sys/cuda"]
rocm = ["gpu", "flodl-sys/rocm"]
mps = ["flodl-sys/mps"]
rng = ["rand"]

[dependencies]
flodl-sys.workspace = true
flodl-hw.workspace = true
indexmap.workspace = true
flate2.workspace = true
hmac-sha256.workspace = true
serde.workspace = true
serde_json.workspace = true
bincode-next.workspace = true
rand = { workspace = true, optional = true }
# `_exit` for cluster roles that finish and must terminate without running
# libtorch's C++ static destructors (which GP-fault when the launcher force-
# exits deep in the call stack — see `clean_process_exit`).
libc.workspace = true

[package.metadata.docs.rs]
# docs.rs has no libtorch — flodl-sys/build.rs gates on env::var("DOCS_RS")
# (set by docs.rs automatically), so we don't need any rustc-arg here.
# `--cfg docsrs` is set as a rustdoc-arg ONLY: passing it via rustc-args
# would propagate to every dep including serde's compile, tripping
# serde 1.0.228's broken `cfg(all(docsrs, if_docsrs_then_no_serde_core))`
# path that breaks every `#[derive(Serialize)]` site with
# "cannot find type Formatter in module _serde::__private228".
rustdoc-args = ["--cfg", "docsrs"]
features = ["rng"]
no-default-features = true

# Examples need libtorch — disable scraping on docs.rs to prevent build failures.
[[example]]
name = "quickstart"
path = "examples/quickstart/main.rs"
doc-scrape-examples = false

[[example]]
name = "auto_promote"
path = "examples/auto_promote/main.rs"
doc-scrape-examples = false

[[example]]
name = "sine_wave"
path = "examples/sine_wave/main.rs"
doc-scrape-examples = false

[[example]]
